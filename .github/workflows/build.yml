name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Environment
        run: |
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_ROOT}" >> $GITHUB_ENV
          echo "${ANDROID_ROOT}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_ROOT}/platform-tools" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses & Install Required NDK
        run: |
          set -e
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="${ANDROID_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(which sdkmanager || echo "")
          fi

          echo "Using sdkmanager from: $SDKMANAGER"

          echo "Accepting Android SDK and NDK licenses..."
          yes | "$SDKMANAGER" --licenses || true

          # List existing pre-installed NDK versions on runner
          echo "Pre-installed NDK versions on runner:"
          ls -1 "${ANDROID_ROOT}/ndk" 2>/dev/null || echo "No ndk directory yet"

          # Target NDK version required by React Native 0.86.3 / Expo SDK 57
          TARGET_NDK="27.1.12297006"

          if [ ! -d "${ANDROID_ROOT}/ndk/${TARGET_NDK}" ]; then
            echo "Installing NDK ${TARGET_NDK} and build-tools..."
            for attempt in 1 2 3; do
              echo "Attempt $attempt of 3: Installing ndk;${TARGET_NDK}..."
              if "$SDKMANAGER" --install "ndk;${TARGET_NDK}" "cmake;3.22.1" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"; then
                echo "NDK ${TARGET_NDK} installed successfully."
                break
              fi
              echo "Attempt $attempt failed. Retrying in 10s..."
              sleep 10
            done
          else
            echo "NDK ${TARGET_NDK} is already installed."
          fi

          # Detect best available NDK (prefer 27.1.12297006, fallback to latest pre-installed)
          CHOSEN_NDK=""
          if [ -d "${ANDROID_ROOT}/ndk/${TARGET_NDK}" ]; then
            CHOSEN_NDK="${TARGET_NDK}"
          elif [ -d "${ANDROID_ROOT}/ndk" ] && [ "$(ls -A "${ANDROID_ROOT}/ndk" 2>/dev/null)" ]; then
            CHOSEN_NDK=$(ls -1 "${ANDROID_ROOT}/ndk" | sort -V | tail -n 1)
            echo "Falling back to available pre-installed NDK: ${CHOSEN_NDK}"
          fi

          echo "Selected NDK: ${CHOSEN_NDK}"
          echo "SELECTED_NDK=${CHOSEN_NDK}" >> $GITHUB_ENV
          if [ -n "${CHOSEN_NDK}" ]; then
            echo "ANDROID_NDK_HOME=${ANDROID_ROOT}/ndk/${CHOSEN_NDK}" >> $GITHUB_ENV
            echo "ANDROID_NDK_ROOT=${ANDROID_ROOT}/ndk/${CHOSEN_NDK}" >> $GITHUB_ENV
            echo "NDK_ROOT=${ANDROID_ROOT}/ndk/${CHOSEN_NDK}" >> $GITHUB_ENV
          fi

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Install NPM Dependencies
        run: npm install

      - name: Prebuild Native Android
        run: npx expo prebuild --platform android --no-install

      - name: Configure Android SDK and NDK Paths
        run: |
          mkdir -p android
          ANDROID_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK_PATH="${ANDROID_ROOT}/ndk/${SELECTED_NDK}"
          
          echo "sdk.dir=${ANDROID_ROOT}" > android/local.properties
          if [ -d "${NDK_PATH}" ]; then
            echo "ndk.dir=${NDK_PATH}" >> android/local.properties
          fi

          # Ensure android.ndkVersion in gradle.properties matches the selected NDK
          if [ -n "${SELECTED_NDK}" ]; then
            if grep -q "android.ndkVersion" android/gradle.properties 2>/dev/null; then
              sed -i "s/^android.ndkVersion=.*/android.ndkVersion=${SELECTED_NDK}/" android/gradle.properties
            else
              echo "android.ndkVersion=${SELECTED_NDK}" >> android/gradle.properties
            fi
          fi

          echo "Contents of android/local.properties:"
          cat android/local.properties
          echo "Configured android.ndkVersion in android/gradle.properties:"
          grep "android.ndkVersion" android/gradle.properties || true

      - name: Ensure Signing Keystore Exists
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "Generating debug.keystore for APK signing..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate Android JS Bundle & Assets
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed --platform android --dev false --entry-file node_modules/expo/AppEntry.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -x test -x lint

      - name: Verify Generated APK
        run: |
          echo "Searching for built APK artifacts:"
          find android/app/build/outputs/apk -name "*.apk" -ls

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickKarya-Release-APK
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
