name: Quick Karya CI & Android APK Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      trigger_eas_build:
        description: "Trigger Expo EAS Android cloud APK build"
        required: false
        default: true
        type: boolean
      eas_profile:
        description: "EAS build profile"
        required: false
        default: preview
        type: choice
        options:
          - preview
          - production
          - development

jobs:
  verify-and-build:
    name: Typecheck, Lint & Bundle Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies cleanly
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Lint Firestore security rules
        run: npm run lint:rules

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Build web app and backend server
        run: npm run build

      - name: Export Expo Android JS bundle
        run: |
          rm -rf expo-ci-export
          npx expo export --platform android --output-dir expo-ci-export
          test -d expo-ci-export
          test -f expo-ci-export/metadata.json
          find expo-ci-export -type f | head -n 20

      - name: Upload Expo Android JS bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-karya-android-bundle
          path: expo-ci-export
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-karya-web-dist
          path: dist
          if-no-files-found: error
          retention-days: 14

  build-android-apk:
    name: Build GitHub Actions Android APK
    needs: verify-and-build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          printf "sdk.dir=%s\n" "$SDK_ROOT" > android/local.properties
          SDK_MANAGER="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$SDK_MANAGER" ] && [ -x "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
            "$SDK_MANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          fi

      - name: Install dependencies cleanly
        run: npm ci

      - name: Sync google-services.json if present
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          fi

      - name: Restore cached CI Android signing keystore
        uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: quick-karya-ci-debug-keystore-${{ github.repository_id }}-v1

      - name: Ensure Android release signing keystore exists for CI APK
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/app/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Print Android signing SHA-1 fingerprint for Firebase
        run: |
          KEYSTORE_INFO="$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android)"
          SHA1_FP="$(printf '%s\n' "$KEYSTORE_INFO" | sed -nE 's/^[[:space:]]*SHA-?1:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1)"
          SHA256_FP="$(printf '%s\n' "$KEYSTORE_INFO" | sed -nE 's/^[[:space:]]*SHA-?256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1)"
          echo "===================================================================="
          echo "QUICK KARYA ANDROID KEYSTORE FINGERPRINTS (ADD SHA-1 TO FIREBASE)"
          echo "Firebase Project : pacific-eye-42ts5"
          echo "Android Package  : com.quickkarya.app"
          echo "SHA-1            : ${SHA1_FP}"
          echo "SHA-256          : ${SHA256_FP}"
          echo "===================================================================="
          printf '%s\n' "$KEYSTORE_INFO"
          {
            echo "### Quick Karya Android Signing Fingerprints"
            echo "- **Firebase Project:** \`pacific-eye-42ts5\`"
            echo "- **Android Package:** \`com.quickkarya.app\`"
            echo "- **Keystore SHA-1:** \`${SHA1_FP}\`"
            echo "- **Keystore SHA-256:** \`${SHA256_FP}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build Android APK with Gradle
        env:
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Verify and print built APK SHA-1 fingerprint
        run: |
          APK_FILE="$(ls -1 android/app/build/outputs/apk/release/*.apk | head -n 1)"
          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "No release APK found under android/app/build/outputs/apk/release/"
            exit 1
          fi
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$(command -v apksigner || find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1 || true)"
          APK_SHA1=""
          APK_SHA256=""
          if [ -n "$APKSIGNER" ] && [ -x "$APKSIGNER" ]; then
            APKSIGNER_OUT="$("$APKSIGNER" verify --print-certs "$APK_FILE")"
            printf '%s\n' "$APKSIGNER_OUT"
            RAW_SHA1="$(printf '%s\n' "$APKSIGNER_OUT" | sed -nE 's/.*SHA-1 digest:[[:space:]]*([0-9A-Fa-f]+).*/\1/p' | head -n 1)"
            RAW_SHA256="$(printf '%s\n' "$APKSIGNER_OUT" | sed -nE 's/.*SHA-256 digest:[[:space:]]*([0-9A-Fa-f]+).*/\1/p' | head -n 1)"
            if [ -n "$RAW_SHA1" ]; then
              APK_SHA1="$(printf '%s' "$RAW_SHA1" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
            fi
            if [ -n "$RAW_SHA256" ]; then
              APK_SHA256="$(printf '%s' "$RAW_SHA256" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')"
            fi
          fi
          if [ -z "$APK_SHA1" ]; then
            APK_CERT_INFO="$(keytool -printcert -jarfile "$APK_FILE" 2>/dev/null || true)"
            if [ -n "$APK_CERT_INFO" ]; then
              printf '%s\n' "$APK_CERT_INFO"
              APK_SHA1="$(printf '%s\n' "$APK_CERT_INFO" | sed -nE 's/^[[:space:]]*SHA-?1:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1)"
              APK_SHA256="$(printf '%s\n' "$APK_CERT_INFO" | sed -nE 's/^[[:space:]]*SHA-?256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1)"
            fi
          fi
          if [ -z "$APK_SHA1" ]; then
            KEYSTORE_INFO="$(keytool -list -v -keystore android/app/debug.keystore -alias androiddebugkey -storepass android -keypass android)"
            APK_SHA1="$(printf '%s\n' "$KEYSTORE_INFO" | sed -nE 's/^[[:space:]]*SHA-?1:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1)"
            APK_SHA256="$(printf '%s\n' "$KEYSTORE_INFO" | sed -nE 's/^[[:space:]]*SHA-?256:[[:space:]]*([0-9A-Fa-f:]+).*/\1/p' | head -n 1)"
          fi
          echo "===================================================================="
          echo "BUILT APK SIGNING CERTIFICATE (COPY THIS SHA-1 INTO FIREBASE)"
          echo "APK File : $APK_FILE"
          echo "SHA-1    : ${APK_SHA1}"
          echo "SHA-256  : ${APK_SHA256}"
          echo "===================================================================="
          {
            echo "- **Built APK:** \`$(basename "$APK_FILE")\`"
            echo "- **Built APK SHA-1:** \`${APK_SHA1}\`"
            echo "- **Built APK SHA-256:** \`${APK_SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload downloadable Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-karya-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  eas-android-build:
    name: Expo EAS Android Cloud APK Build
    needs: verify-and-build
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.trigger_eas_build == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_EAS_AUTO_BUILD == 'true')

    steps:
      - name: Check EXPO_TOKEN availability
        id: eas_auth
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN secret is not configured in GitHub Secrets; skipping EAS cloud build trigger."
          fi

      - name: Checkout repository
        if: steps.eas_auth.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.eas_auth.outputs.has_token == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Set up Expo & EAS CLI
        if: steps.eas_auth.outputs.has_token == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies cleanly
        if: steps.eas_auth.outputs.has_token == 'true'
        run: npm ci

      - name: Trigger EAS Android APK build
        if: steps.eas_auth.outputs.has_token == 'true'
        run: npx eas-cli build --platform android --profile "${{ inputs.eas_profile || 'preview' }}" --non-interactive --no-wait
